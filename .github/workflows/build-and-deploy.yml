name: Build & Deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: moviehubapi
  AZURE_WEBAPP_PACKAGE_PATH: "./movie-hub-api/publish"
  DOTNET_VERSION: "10.x"
  SOLUTION_PATH: "movie-hub-api.sln"
  PUBLISH_DIR: "./publish"

jobs:
  build:
    name: Build, test and publish
    runs-on: ubuntu-latest
    steps:
      # Get moviehubapi repo into Github actions runner
      - uses: actions/checkout@v6

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} -c Release --no-restore

      - name: Test
        run: dotnet test ${{ env.SOLUTION_PATH }} -c Release --no-restore --no-build --verbosity normal

      - name: Publish
        run: dotnet publish ${{ env.SOLUTION_PATH }} -c Release --no-restore --no-build --property:PublishDir=${{ env.PUBLISH_DIR }}

      - name: Publish Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: moviehubapi-published-artifact
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH}}

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v7
        with:
          name: moviehubapi-published-artifact
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH}}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
